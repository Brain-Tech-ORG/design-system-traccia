<!doctype html>
<html lang="it" data-w="270" data-h="220">
<head>
  <meta charset="utf-8">
  <title>La Traccia — SIN 2026 — Parete fondale 1 — 270×220 cm (1:10)</title>
  <link rel="stylesheet" href="stand.css">
  <style>
    /* File 270×220, area visibile 250×200: 10 cm nascosti per lato.
       Il marchio, e basta: niente testo, nemmeno il wordmark. Pieno, blu di
       marca, alto 170 cm, al centro dell'area visibile, con 15 cm d'aria
       sopra e sotto. E' la cosa che chi passa in corsia deve riconoscere. */
    @page { size: 270mm 220mm; }
    .st-sheet { --w: 270mm; --h: 220mm; }
    .fondale__mark {
      position: absolute;
      left: 50%;
      top: 50%;
      height: 170mm;
      width: auto;
      transform: translate(-50%, -50%);
      display: block;
    }
  </style>
</head>
<body>
  <div class="st-sheet st-sheet--wall">
    <div class="st-safe">
      <svg class="fondale__mark" viewBox="0 0 594 717" role="img" aria-label="La Traccia">
        <path fill="#4194d7" d="M197.4 0.6 593 351.7 396.1 526.2 0.5 175.2Z"/>
        <path fill="#4194d7" d="M183.2 714.5C183.7 649.2 183.8 531.5 183.1 362.4L386 538.4C386 538.4 185.3 716.3 183.2 714.5Z"/>
      </svg>
    </div>

    <div class="st-guide st-guide--hidden">
      <span class="st-guide__label" style="left: 2mm; top: 2mm">Area visibile 250 × 200 cm · 10 cm nascosti per lato</span>
    </div>
  </div>
  <script src="stand.js"></script>
</body>
</html>
