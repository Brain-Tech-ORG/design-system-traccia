<!doctype html>
<html lang="it" data-w="100" data-h="200">
<head>
  <meta charset="utf-8">
  <title>La Traccia — SIN 2026 — Totem esterno, lato B · Modelli IA per la nefrologia — 100×200 cm (1:10)</title>
  <link rel="stylesheet" href="stand.css">
  <style>
    /* File 100×200, margine di sicurezza 8 cm. Testata come sul lato A:
       marchio, eyebrow, titolo display. Poi il dispositivo AI, hardware
       custom: due unita' in wireframe, con il marchio La Traccia stampato
       sopra e la sigla AI — quella da tavolo accanto a «Ambulatorio», quella
       portatile accanto a «Rilevazioni a bordo letto». */
    @page { size: 100mm 200mm; }
    .st-sheet { --w: 100mm; --h: 200mm; --hide-t: 0; --hide-r: 0; --hide-b: 0; --hide-l: 0; }
    .totem { display: flex; flex-direction: column; padding: 7mm 8mm 6mm; }
    .totem__intro { margin-top: 8mm; }
    .totem__intro .st-h1 { --t-display: 8mm; }
    /* Il blocco del dispositivo sta a meta' tra il titolo e il piede:
       due righe, un'unita' e la sua parola. */
    .device {
      margin-top: auto;
      margin-bottom: auto;
      display: grid;
      grid-template-columns: 42mm 1fr;
      column-gap: 6mm;
      row-gap: 12mm;
      align-items: center;
    }
    .device__drawing { width: 42mm; height: auto; }
    .device__item { display: flex; flex-direction: column; gap: 3mm; }
    .device__item .st-h1 { --t-display: 4.8mm; }
    .totem__foot { padding-top: 6mm; display: flex; flex-direction: column; gap: 3mm; }
    .totem__foot .st-footer { padding-top: 3mm; }
    .st-watermark { width: 92mm; bottom: -30mm; right: -36mm; }
  </style>
</head>
<body>
  <div class="st-sheet st-sheet--totem">
    <svg class="st-watermark" viewBox="0 0 594 717" aria-hidden="true">
      <path d="M197.4 0.6 593 351.7 396.1 526.2 0.5 175.2Z"/>
      <path d="M183.2 714.5C183.7 649.2 183.8 531.5 183.1 362.4L386 538.4C386 538.4 185.3 716.3 183.2 714.5Z"/>
    </svg>

    <div class="st-safe totem">
      <header>
        <div class="st-lockup" data-fit-w="64" role="img" aria-label="La Traccia">
          <svg class="st-lockup__mark" viewBox="0 0 594 717" aria-hidden="true">
            <path fill="#4194d7" d="M197.4 0.6 593 351.7 396.1 526.2 0.5 175.2Z"/>
            <path fill="#4194d7" d="M183.2 714.5C183.7 649.2 183.8 531.5 183.1 362.4L386 538.4C386 538.4 185.3 716.3 183.2 714.5Z"/>
          </svg>
          <span class="st-lockup__word">La Traccia</span>
        </div>
      </header>

      <section class="totem__intro">
        <div class="st-eyebrow">
          <span class="st-eyebrow__label">Novità</span>
          <span class="st-eyebrow__line"></span>
        </div>
        <h1 class="st-h1">Modelli IA per la <em>nefrologia</em></h1>
      </section>

      <div class="device">
        <!-- Unita' da tavolo, vista dall'alto: corpo tondo, anello LED,
             marchio La Traccia stampato, simbolo del microfono, sigla AI. -->
        <svg class="st-drawing device__drawing" viewBox="0 0 200 200" role="img" aria-label="Unità da tavolo del dispositivo AI La Traccia">
          <circle class="silhouette" cx="100" cy="100" r="86"/>
          <circle class="brand" cx="100" cy="100" r="73" stroke-width="3"/>
          <g class="mark" transform="translate(91 34) scale(0.03)">
            <path d="M197.4 0.6 593 351.7 396.1 526.2 0.5 175.2Z"/>
            <path d="M183.2 714.5C183.7 649.2 183.8 531.5 183.1 362.4L386 538.4C386 538.4 185.3 716.3 183.2 714.5Z"/>
          </g>
          <g class="brand" stroke-width="3" transform="translate(100 104) scale(1.5)">
            <rect x="-5" y="-16" width="10" height="18" rx="5"/>
            <path d="M-10 -2a10 10 0 0 0 20 0"/>
            <path d="M0 8v5"/>
            <path d="M-6 13h12"/>
          </g>
          <text class="label" x="100" y="160" text-anchor="middle" font-size="26">AI</text>
        </svg>
        <div class="device__item">
          <span class="st-accent-dash"></span>
          <p class="st-h1">Ambulatorio</p>
        </div>

        <!-- Unita' portatile: corpo con clip, marchio, sigla AI, LED,
             onde senza fili. -->
        <svg class="st-drawing device__drawing" viewBox="0 0 200 140" role="img" aria-label="Unità portatile del dispositivo AI La Traccia">
          <rect class="silhouette" x="58" y="16" width="34" height="18" rx="6"/>
          <rect class="silhouette" x="20" y="30" width="110" height="80" rx="18"/>
          <g class="mark" transform="translate(36 50) scale(0.028)">
            <path d="M197.4 0.6 593 351.7 396.1 526.2 0.5 175.2Z"/>
            <path d="M183.2 714.5C183.7 649.2 183.8 531.5 183.1 362.4L386 538.4C386 538.4 185.3 716.3 183.2 714.5Z"/>
          </g>
          <text class="label" x="104" y="78" text-anchor="middle" font-size="24">AI</text>
          <circle class="brand-fill" cx="115" cy="96" r="3.5"/>
          <g class="brand" stroke-width="2.5">
            <path d="M150 52a22 22 0 0 1 0 32"/>
            <path d="M164 40a40 40 0 0 1 0 56"/>
          </g>
        </svg>
        <div class="device__item">
          <span class="st-accent-dash"></span>
          <p class="st-h1">Rilevazioni a bordo letto</p>
        </div>
      </div>

      <footer class="totem__foot">
        <p class="st-mono st-mono--brand" style="margin:0">Chiedi una dimostrazione allo stand</p>
        <div class="st-footer">
          <div class="st-footer__contacts">
            <span class="st-footer__contact"><span class="st-dot"></span>latraccia.it</span>
            <span class="st-footer__contact"><span class="st-dot"></span>info@latraccia.it</span>
          </div>
        </div>
      </footer>
    </div>

    <div class="st-guide st-guide--hidden">
      <span class="st-guide__label" style="left: 2mm; top: 2mm">Totem 100 × 200 cm · margine di sicurezza 8 cm</span>
    </div>
  </div>
  <script src="stand.js"></script>
</body>
</html>
