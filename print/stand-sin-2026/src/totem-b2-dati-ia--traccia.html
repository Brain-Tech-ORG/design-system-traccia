<!doctype html>
<html lang="it" data-w="100" data-h="200">
<head>
  <meta charset="utf-8">
  <title>La Traccia — SIN 2026 — Totem 2, lato B · Proposta «traccia»: il marchio sulla serie dei dati — 100×200 cm (1:10)</title>
  <link rel="stylesheet" href="stand.css">
  <style>
    /* Proposta «traccia». File 100×200, margine di sicurezza 8 cm. Testata
       come sul lato A; poi il marchio pieno, grande, posato sulla serie dei
       dati che attraversa il totem da bordo a bordo: a sinistra i dati
       raccolti, pieni; a destra, dopo il marchio, la proiezione dell'IA,
       tratteggiata e chiara. Il marchio e' il presente. */
    @page { size: 100mm 200mm; }
    .st-sheet { --w: 100mm; --h: 200mm; --hide-t: 0; --hide-r: 0; --hide-b: 0; --hide-l: 0; }
    .totem { display: flex; flex-direction: column; padding: 7mm 8mm 6mm; }
    .totem__intro { margin-top: 8mm; }
    .totem__intro .st-h1 { --t-display: 8mm; }
    /* Il disegno va da bordo a bordo del foglio: la serie entra ed esce. */
    .hero { margin: auto -8mm; width: 100mm; height: auto; }
    .totem__foot { padding-top: 6mm; display: flex; flex-direction: column; gap: 3mm; }
    .totem__foot .st-certs { gap: 2mm 4mm; }
    .totem__foot .st-certs__list { font-size: 2.3mm; line-height: 1.45; }
    .totem__foot .st-footer { padding-top: 3mm; }
  </style>
</head>
<body>
  <div class="st-sheet st-sheet--totem">
    <div class="st-safe totem">
      <header>
        <div class="st-lockup" data-fit-w="64" role="img" aria-label="La Traccia">
          <svg class="st-lockup__mark" viewBox="0 0 594 717" aria-hidden="true">
            <path fill="#4194d7" d="M197.4 0.6 593 351.7 396.1 526.2 0.5 175.2Z"/>
            <path fill="#4194d7" d="M183.2 714.5C183.7 649.2 183.8 531.5 183.1 362.4L386 538.4C386 538.4 185.3 716.3 183.2 714.5Z"/>
          </svg>
          <span class="st-lockup__word">La Traccia</span>
        </div>
      </header>

      <section class="totem__intro">
        <div class="st-eyebrow">
          <span class="st-eyebrow__label">Gen BI</span>
          <span class="st-eyebrow__line"></span>
          <span class="st-eyebrow__note">Dati clinici e IA</span>
        </div>
        <h1 class="st-h1">Ogni dato lascia una <em>traccia</em></h1>
      </section>

      <!-- Coordinate del marchio (viewBox 594 x 717): il marchio largo 46 cm,
           con il bordo sinistro a 38 cm dal bordo del totem. La serie passa
           dietro al marchio: entra dal lato in basso a sinistra, esce dal
           lato in alto a destra. -->
      <svg class="st-drawing hero" viewBox="-491 -40 1292 800" role="img" aria-label="Il marchio La Traccia posato su una serie di dati: dati raccolti a sinistra, proiezione dell'IA a destra">
        <polyline class="trace" points="-560,440 -450,470 -345,520 -240,430 -135,455 -40,330 150,215 350,250"/>
        <polyline class="trace trace--next" points="350,250 660,290 760,240 880,215"/>
        <g class="l500">
          <circle cx="-450" cy="470" r="15"/>
          <circle cx="-345" cy="520" r="15"/>
          <circle cx="-240" cy="430" r="15"/>
          <circle cx="-135" cy="455" r="15"/>
          <circle cx="-40" cy="330" r="15"/>
        </g>
        <g class="l100">
          <circle cx="660" cy="290" r="15"/>
          <circle cx="760" cy="240" r="15"/>
        </g>
        <g class="solid">
          <path d="M197.4 0.6 593 351.7 396.1 526.2 0.5 175.2Z"/>
          <path d="M183.2 714.5C183.7 649.2 183.8 531.5 183.1 362.4L386 538.4C386 538.4 185.3 716.3 183.2 714.5Z"/>
        </g>
      </svg>

      <footer class="totem__foot">
        <div class="st-certs">
          <span class="st-certs__label">Certificazioni</span>
          <span class="st-certs__list">ISO 9001:2015 · ISO 13485:2016 · ISO/IEC 27001:2022 · UNI PdR 125 · UNI EN ISO 14001:2015 · UNI ISO 37001:2025 · PASS 24000:2022</span>
        </div>
        <div class="st-footer">
          <div class="st-footer__contacts">
            <span class="st-footer__contact"><span class="st-dot"></span>latraccia.it</span>
            <span class="st-footer__contact"><span class="st-dot"></span>info@latraccia.it</span>
          </div>
        </div>
      </footer>
    </div>

    <div class="st-guide st-guide--hidden">
      <span class="st-guide__label" style="left: 2mm; top: 2mm">Totem 100 × 200 cm · margine di sicurezza 8 cm</span>
    </div>
  </div>
  <script src="stand.js"></script>
</body>
</html>
