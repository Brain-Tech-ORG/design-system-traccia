<!doctype html>
<html lang="it" data-w="100" data-h="200">
<head>
  <meta charset="utf-8">
  <title>La Traccia — SIN 2026 — Totem esterno, lato B · Le due novità insieme — 100×200 cm (1:10)</title>
  <link rel="stylesheet" href="stand.css">
  <style>
    /* Variante: le due novita' sullo stesso lato, una sopra l'altra, per
       chi preferisce i due totem identici. Sopra il microfono AI con le due
       parole accanto; sotto il percorso infermieristico. */
    @page { size: 100mm 200mm; }
    .st-sheet { --w: 100mm; --h: 200mm; --hide-t: 0; --hide-r: 0; --hide-b: 0; --hide-l: 0; }
    .totem { display: flex; flex-direction: column; padding: 7mm 8mm 6mm; }
    .block { margin-top: 8mm; }
    .block .st-eyebrow + .st-h1 { margin-top: 5mm; }
    .block .st-h1--title { --t-display: 5mm; }
    .mic {
      margin-top: 6mm;
      display: grid;
      grid-template-columns: 22mm 1fr;
      gap: 8mm;
      align-items: center;
    }
    .mic__drawing { width: 22mm; height: auto; }
    .mic__text { display: flex; flex-direction: column; gap: 6mm; }
    .mic__item { display: flex; flex-direction: column; gap: 2.5mm; }
    /* «Rilevazioni a bordo letto» va a capo dopo «a»: due righe pari, non
       una parola orfana. */
    .mic__item .st-h1 { --t-display: 4.4mm; max-width: 44mm; }
    .path { margin-top: 6mm; width: 50mm; height: auto; margin-left: 2mm; }
    .totem__foot { margin-top: auto; padding-top: 6mm; }
    .totem__foot .st-footer { padding-top: 3mm; }
    .st-watermark { width: 92mm; bottom: -30mm; right: -36mm; }
  </style>
</head>
<body>
  <div class="st-sheet st-sheet--totem">
    <svg class="st-watermark" viewBox="0 0 594 717" aria-hidden="true">
      <path d="M197.4 0.6 593 351.7 396.1 526.2 0.5 175.2Z"/>
      <path d="M183.2 714.5C183.7 649.2 183.8 531.5 183.1 362.4L386 538.4C386 538.4 185.3 716.3 183.2 714.5Z"/>
    </svg>

    <div class="st-safe totem">
      <header>
        <div class="st-lockup" data-fit-w="58" role="img" aria-label="La Traccia">
          <svg class="st-lockup__mark" viewBox="0 0 594 717" aria-hidden="true">
            <path fill="#4194d7" d="M197.4 0.6 593 351.7 396.1 526.2 0.5 175.2Z"/>
            <path fill="#4194d7" d="M183.2 714.5C183.7 649.2 183.8 531.5 183.1 362.4L386 538.4C386 538.4 185.3 716.3 183.2 714.5Z"/>
          </svg>
          <span class="st-lockup__word">La Traccia</span>
        </div>
      </header>

      <section class="block">
        <div class="st-eyebrow">
          <span class="st-eyebrow__label">Novità</span>
          <span class="st-eyebrow__line"></span>
          <span class="st-eyebrow__note">Hardware custom</span>
        </div>
        <h1 class="st-h1 st-h1--title">Modelli IA per la <em>nefrologia</em></h1>
        <div class="mic">
          <div>
            <svg class="st-drawing mic__drawing" viewBox="0 0 200 400" role="img" aria-label="Microfono AI, hardware custom">
              <rect class="silhouette" x="55" y="14" width="90" height="150" rx="45"/>
              <g class="line">
                <path d="M74 44h52M66 60h68M64 76h72M66 92h68"/>
                <path d="M100 28v72M84 32v64M116 32v64"/>
              </g>
              <text class="label" x="100" y="144" text-anchor="middle" font-size="40">AI</text>
              <ellipse class="brand" cx="100" cy="158" rx="43" ry="8" stroke-width="3"/>
              <rect class="silhouette" x="89" y="166" width="22" height="16" rx="4"/>
              <rect class="silhouette" x="94" y="182" width="12" height="126" rx="6"/>
              <ellipse class="silhouette" cx="100" cy="330" rx="80" ry="26"/>
              <ellipse class="brand" cx="100" cy="330" rx="60" ry="17" stroke-width="2.5" stroke-dasharray="5 6"/>
              <circle class="brand-fill" cx="134" cy="324" r="4"/>
              <g class="brand" stroke-width="2.5">
                <path d="M158 40a26 26 0 0 1 0 36"/>
                <path d="M172 28a44 44 0 0 1 0 60"/>
              </g>
            </svg>
          </div>
          <div class="mic__text">
            <div class="mic__item">
              <span class="st-accent-dash"></span>
              <p class="st-h1">Ambulatorio</p>
            </div>
            <div class="mic__item">
              <span class="st-accent-dash"></span>
              <p class="st-h1">Rilevazioni a bordo letto</p>
            </div>
          </div>
        </div>
      </section>

      <section class="block">
        <div class="st-eyebrow">
          <span class="st-eyebrow__label">Novità</span>
          <span class="st-eyebrow__line"></span>
          <span class="st-eyebrow__note">Cartella clinica Gepadial</span>
        </div>
        <h2 class="st-h1 st-h1--title">Nuovo percorso infermieristico <em>personalizzato</em></h2>
        <svg class="st-drawing path" viewBox="0 0 300 250" role="img" aria-label="Percorso infermieristico personalizzato">
          <path class="track" d="M24 22v94"/>
          <path class="track track--light" d="M24 116v110"/>
          <g class="wire">
            <path d="M56 16h150M56 30h96"/>
            <path d="M56 64h120M56 78h170"/>
            <path d="M56 112h160M56 126h88"/>
            <path d="M56 160h130M56 174h150"/>
            <path d="M56 208h110M56 222h60"/>
          </g>
          <circle class="node" cx="24" cy="22" r="8"/>
          <circle class="node" cx="24" cy="70" r="8"/>
          <circle class="node node--current" cx="24" cy="118" r="8"/>
          <circle class="node node--next" cx="24" cy="166" r="8"/>
          <circle class="node node--next" cx="24" cy="214" r="8"/>
        </svg>
      </section>

      <footer class="totem__foot">
        <div class="st-footer">
          <span class="st-mono st-mono--brand">Chiedi una dimostrazione allo stand</span>
        </div>
      </footer>
    </div>

    <div class="st-guide st-guide--hidden">
      <span class="st-guide__label" style="left: 2mm; top: 2mm">Totem 100 × 200 cm · margine di sicurezza 8 cm</span>
    </div>
  </div>
  <script src="stand.js"></script>
</body>
</html>
