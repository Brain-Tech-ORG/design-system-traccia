<!doctype html>
<html lang="it" data-w="100" data-h="200">
<head>
  <meta charset="utf-8">
  <title>La Traccia — SIN 2026 — Totem esterno, lato B · Nuovo percorso infermieristico personalizzato — 100×200 cm (1:10)</title>
  <link rel="stylesheet" href="stand.css">
  <style>
    /* File 100×200, margine di sicurezza 8 cm. Un titolo e un disegno, e
       basta: il percorso e' un binario con le tappe — fatte, in corso, da
       fare — e accanto a ogni tappa il wireframe di una riga. Resta vago
       per scelta. */
    @page { size: 100mm 200mm; }
    .st-sheet { --w: 100mm; --h: 200mm; --hide-t: 0; --hide-r: 0; --hide-b: 0; --hide-l: 0; }
    .totem { display: flex; flex-direction: column; padding: 7mm 8mm 6mm; }
    /* Poco contenuto: il blocco sta a meta' tra il marchio e il piede. */
    .totem__body { margin-top: auto; margin-bottom: auto; }
    .totem__intro { margin-top: 8mm; }
    .totem__intro .st-h1 { --t-display: 7.6mm; }
    .path { margin-top: 16mm; width: 82mm; height: auto; margin-left: 1mm; }
    .totem__foot { padding-top: 6mm; display: flex; flex-direction: column; gap: 3mm; }
    .totem__foot .st-footer { padding-top: 3mm; }
  </style>
</head>
<body>
  <div class="st-sheet st-sheet--totem">
    <div class="st-safe totem">
      <header>
        <div class="st-lockup" data-fit-w="50" role="img" aria-label="La Traccia">
          <svg class="st-lockup__mark" viewBox="0 0 594 717" aria-hidden="true">
            <path fill="#4194d7" d="M197.4 0.6 593 351.7 396.1 526.2 0.5 175.2Z"/>
            <path fill="#4194d7" d="M183.2 714.5C183.7 649.2 183.8 531.5 183.1 362.4L386 538.4C386 538.4 185.3 716.3 183.2 714.5Z"/>
          </svg>
          <span class="st-lockup__word">La Traccia</span>
        </div>
      </header>

      <div class="totem__body">
      <section class="totem__intro">
        <div class="st-eyebrow">
          <span class="st-eyebrow__label">Novità</span>
          <span class="st-eyebrow__line"></span>
          <span class="st-eyebrow__note">Cartella clinica</span>
        </div>
        <h1 class="st-h1">Nuovo percorso infermieristico <em>personalizzato</em></h1>
      </section>

      <!-- Il percorso: binario pieno fino alla tappa in corso, chiaro dopo;
           tappe fatte piene, in corso ad anello, da fare in tinta chiara.
           Accanto, il wireframe di una riga: una lunga e una corta. -->
      <svg class="st-drawing path" viewBox="0 0 300 250" role="img" aria-label="Percorso infermieristico personalizzato">
        <path class="track" d="M24 22v94"/>
        <path class="track track--light" d="M24 116v110"/>
        <g class="wire">
          <path d="M56 16h150M56 30h96"/>
          <path d="M56 64h120M56 78h170"/>
          <path d="M56 112h160M56 126h88"/>
          <path d="M56 160h130M56 174h150"/>
          <path d="M56 208h110M56 222h60"/>
        </g>
        <circle class="node" cx="24" cy="22" r="8"/>
        <circle class="node" cx="24" cy="70" r="8"/>
        <circle class="node node--current" cx="24" cy="118" r="8"/>
        <circle class="node node--next" cx="24" cy="166" r="8"/>
        <circle class="node node--next" cx="24" cy="214" r="8"/>
      </svg>
      </div>

      <footer class="totem__foot">
        <p class="st-mono st-mono--brand" style="margin:0">Chiedi una dimostrazione allo stand</p>
        <div class="st-footer">
          <div class="st-footer__contacts">
            <span class="st-footer__contact"><span class="st-dot"></span>latraccia.it</span>
            <span class="st-footer__contact"><span class="st-dot"></span>info@latraccia.it</span>
          </div>
        </div>
      </footer>
    </div>

    <div class="st-guide st-guide--hidden">
      <span class="st-guide__label" style="left: 2mm; top: 2mm">Totem 100 × 200 cm · margine di sicurezza 8 cm</span>
    </div>
  </div>
  <script src="stand.js"></script>
</body>
</html>
