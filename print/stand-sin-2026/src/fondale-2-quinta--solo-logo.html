<!doctype html>
<html lang="it" data-w="220" data-h="220">
<head>
  <meta charset="utf-8">
  <title>La Traccia — SIN 2026 — Parete fondale 2 (quinta) — solo logo — 220×220 cm (1:10)</title>
  <link rel="stylesheet" href="stand.css">
  <style>
    /* Variante senza sagoma outline: solo il lockup. */
    /* File 220×220, area visibile 200×200: 10 cm nascosti per lato.
       Stesso impianto del fondale 1, lockup a 168 cm; la sagoma sborda
       dall'angolo basso a sinistra, cosi' i due pannelli si rispondono. */
    @page { size: 220mm 220mm; }
    .st-sheet { --w: 220mm; --h: 220mm; }
    .fondale__lockup {
      position: absolute;
      left: 50%;
      top: 47%;
      transform: translate(-50%, -50%);
    }
  </style>
</head>
<body>
  <div class="st-sheet st-sheet--wall">

    <div class="st-safe">
      <div class="st-lockup fondale__lockup" data-fit-w="168" role="img" aria-label="La Traccia">
        <svg class="st-lockup__mark" viewBox="0 0 594 717" aria-hidden="true">
          <path fill="#4194d7" d="M197.4 0.6 593 351.7 396.1 526.2 0.5 175.2Z"/>
          <path fill="#4194d7" d="M183.2 714.5C183.7 649.2 183.8 531.5 183.1 362.4L386 538.4C386 538.4 185.3 716.3 183.2 714.5Z"/>
        </svg>
        <span class="st-lockup__word">La Traccia</span>
      </div>
    </div>

    <div class="st-guide st-guide--hidden">
      <span class="st-guide__label" style="left: 2mm; top: 2mm">Area visibile 200 × 200 cm · 10 cm nascosti per lato</span>
    </div>
  </div>
  <script src="stand.js"></script>
</body>
</html>
