<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>La Traccia — SIN 2026 — Totem: tre varianti</title>
  <!-- Tavola per la scelta interna: i totem sono due, le varianti tre.
       A4 orizzontale, una pagina; le miniature sono le anteprime
       rasterizzate dai PDF in scala (out/anteprime). Non va all'allestitore. -->
  <link rel="stylesheet" href="../../../css/traccia-fonts.css">
  <link rel="stylesheet" href="../../../tokens/tokens.css">
  <link rel="stylesheet" href="../../../css/traccia.css">
  <style>
    @page { size: 297mm 210mm; margin: 0; }
    html, body { margin: 0; background: #fff; }
    body {
      font-family: var(--tr-font-display);
      color: var(--tr-ink-600);
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
    .page {
      width: 297mm;
      height: 210mm;
      box-sizing: border-box;
      padding: 11mm 14mm 9mm;
      display: flex;
      flex-direction: column;
      break-after: page;
      overflow: hidden;
    }
    .page:last-child { break-after: auto; }

    /* Testata: marchio a sinistra, riferimento del documento a destra. */
    .tr-header { padding-bottom: 3.5mm; }
    .tr-brandmark { --tr-brandmark-h: 7mm; }
    .doc-ref {
      font-family: var(--tr-font-mono);
      font-weight: var(--tr-weight-semibold);
      font-size: 2.7mm;
      letter-spacing: var(--tr-tracking-mono-mid);
      text-transform: uppercase;
      color: var(--tr-brand-500);
    }

    .intro { margin-top: 6mm; }
    .intro .tr-eyebrow__label { font-size: 2.9mm; }
    .intro .tr-eyebrow__note { font-size: 2.6mm; }
    .intro .tr-h2 { font-size: 8mm; }

    /* Miniature: due righe, ciascuna a una scala sola, dichiarata. */
    .row { margin-top: 6mm; }
    .row__head {
      display: flex;
      align-items: baseline;
      gap: 3mm;
      font-family: var(--tr-font-mono);
      font-size: 2.6mm;
      letter-spacing: var(--tr-tracking-mono);
      text-transform: uppercase;
      color: var(--tr-ink-400);
    }
    .row__head strong { color: var(--tr-ink-900); font-weight: var(--tr-weight-semibold); }
    .thumbs { margin-top: 3mm; display: flex; align-items: flex-end; gap: 7mm; }
    .thumb { margin: 0; }
    .thumb img { display: block; outline: 0.25mm solid var(--tr-border-soft-2); }
    .thumb figcaption { margin-top: 2.2mm; display: flex; align-items: center; gap: 2mm; }
    .num {
      flex: none;
      width: 5.6mm;
      height: 5.6mm;
      border-radius: var(--tr-radius-pill);
      border: 0.3mm solid var(--tr-brand-500);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: var(--tr-font-mono);
      font-weight: var(--tr-weight-semibold);
      font-size: 2.3mm;
      color: var(--tr-brand-500);
    }
    .cap { display: flex; flex-direction: column; gap: 0.6mm; }
    .cap b {
      font-family: var(--tr-font-mono);
      font-weight: var(--tr-weight-semibold);
      font-size: 2.4mm;
      letter-spacing: var(--tr-tracking-mono);
      text-transform: uppercase;
      color: var(--tr-ink-900);
    }
    .cap span {
      font-family: var(--tr-font-mono);
      font-size: 2.3mm;
      letter-spacing: var(--tr-tracking-mono);
      text-transform: uppercase;
      color: var(--tr-ink-400);
    }

    /* Scala 1:60 per le pareti (1 cm in opera = 1/60 cm sul foglio). */
    .walls img { height: calc(220mm / 60 * 10); }
    /* Scala 1:30 per i totem. */
    .totems img { height: calc(200mm / 30 * 10); }

    /* Piede: emittente a sinistra, pagina a destra. */
    .foot {
      margin-top: auto;
      padding-top: 3mm;
      border-top: 0.25mm solid var(--tr-border-soft);
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 6mm;
      font-family: var(--tr-font-mono);
      font-size: 2.3mm;
      letter-spacing: var(--tr-tracking-mono);
      text-transform: uppercase;
      color: var(--tr-ink-400);
    }
    .foot b { color: var(--tr-ink-600); font-weight: var(--tr-weight-semibold); }

    /* Pagina 2: la tabella dei file a tutta pagina, sotto specifiche e
       riferimenti affiancati. */
    table.files { width: 100%; margin-top: 6mm; border-collapse: collapse; }
    table.files th {
      text-align: left;
      font-family: var(--tr-font-mono);
      font-weight: var(--tr-weight-body);
      font-size: 2.3mm;
      letter-spacing: var(--tr-tracking-mono);
      text-transform: uppercase;
      color: var(--tr-ink-400);
      padding: 0 2.5mm 2mm 0;
      border-bottom: 0.25mm solid var(--tr-border-soft-2);
    }
    table.files td {
      padding: 1.5mm 2.5mm 1.5mm 0;
      border-bottom: 0.25mm solid var(--tr-border-soft);
      vertical-align: top;
      font-size: 2.9mm;
      line-height: 1.35;
      color: var(--tr-ink-600);
    }
    table.files td.n { width: 8mm; }
    table.files td.n .num { width: 4.8mm; height: 4.8mm; font-size: 2.1mm; }
    table.files td { vertical-align: middle; }
    table.files td.file {
      font-family: var(--tr-font-mono);
      font-size: 2.35mm;
      letter-spacing: 0.02em;
      color: var(--tr-ink-900);
      white-space: nowrap;
    }
    table.files td.piece { font-weight: var(--tr-weight-semibold); color: var(--tr-ink-900); white-space: nowrap; }
    table.files th { white-space: nowrap; }
    table.files td.size {
      font-family: var(--tr-font-mono);
      font-size: 2.5mm;
      white-space: nowrap;
      color: var(--tr-ink-900);
    }
    table.files td.note { font-size: 2.6mm; color: var(--tr-ink-400); }

    .cols { margin-top: 6mm; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12mm; align-items: start; }
    .specs .tr-eyebrow__label { font-size: 2.6mm; }
    .specs .tr-datatable { margin-top: 3mm; }
    /* Etichetta in colonna fissa, valore allineato a sinistra: su due righe
       un testo allineato a destra si legge a fatica. */
    .specs .tr-datatable__row {
      display: grid;
      grid-template-columns: 26mm minmax(0, 1fr);
      gap: 4mm;
      padding: 1.4mm 0;
    }
    .specs .tr-datatable__label { font-size: 2.2mm; white-space: nowrap; }
    .specs .tr-datatable__value {
      font-family: var(--tr-font-display);
      font-weight: var(--tr-weight-body);
      font-size: 2.7mm;
      letter-spacing: 0;
      line-height: 1.35;
      text-align: left;
    }
    .specs .tr-datatable__value strong { font-weight: var(--tr-weight-semibold); color: var(--tr-ink-900); }

    /* Le tre varianti, alla stessa scala (1:16 fra loro), con la
       descrizione sotto. */
    .variants { margin-top: 5mm; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10mm; flex: 1; }
    .variant { margin: 0; display: flex; flex-direction: column; gap: 3mm; }
    .variant img { display: block; height: 118mm; width: auto; outline: 0.25mm solid var(--tr-border-soft-2); align-self: flex-start; }
    .variant figcaption { display: flex; gap: 2.5mm; align-items: flex-start; }
    .variant p { margin: 1.2mm 0 0; font-size: 3mm; line-height: 1.45; color: var(--tr-ink-600); max-width: 74mm; }
  </style>
</head>
<body>
  <section class="page">
    <header class="tr-header">
      <span class="tr-brandmark">
        <img class="tr-brandmark__logo" src="../../../assets/logo-traccia-mark.svg" alt="" aria-hidden="true">
        <span class="tr-brandmark__wordmark">traccia</span>
      </span>
      <span class="doc-ref">Totem · tre varianti · 9 ottobre 2026</span>
    </header>

    <div class="intro">
      <div class="tr-eyebrow">
        <span class="tr-eyebrow__label">Totem esterni</span>
        <span class="tr-eyebrow__line"></span>
        <span class="tr-eyebrow__note">Due totem da 100 × 200 cm · tre varianti tra cui scegliere</span>
      </div>
      <h1 class="tr-h2">Tre varianti per due <em>totem</em></h1>
    </div>

    <div class="variants">
      <figure class="variant">
        <img src="../out/anteprime/totem-1-ambulatorio-ia.png" alt="Variante 1">
        <figcaption><span class="num">1</span><span class="cap"><b>Modelli IA per la nefrologia</b><span>Novità · hardware custom</span>
          <p>Il microfono AI, hardware custom, e accanto i due usi: ambulatorio e rilevazioni a bordo letto.</p></span></figcaption>
      </figure>
      <figure class="variant">
        <img src="../out/anteprime/totem-2-dati-ia.png" alt="Variante 2">
        <figcaption><span class="num">2</span><span class="cap"><b>I dati clinici prendono forma</b><span>Gen BI · dati clinici e IA</span>
          <p>Istituzionale: il marchio composto di punti, una mappa di dati clinici; certificazioni e contatti.</p></span></figcaption>
      </figure>
      <figure class="variant">
        <img src="../out/anteprime/totem-3-percorso-infermieristico.png" alt="Variante 3">
        <figcaption><span class="num">3</span><span class="cap"><b>Percorso infermieristico personalizzabile</b><span>Novità · Gepadial</span>
          <p>Il percorso standard accanto a quello costruito sull'azienda ospedaliera, con tappe proprie.</p></span></figcaption>
      </figure>
    </div>

    <footer class="foot">
      <span><b>Cooperativa E.D.P. La Traccia</b> · Recinto II Fiorentini, 10 — 75100 Matera · P.IVA 00317370773</span>
      <span>Documento interno · non per l'allestitore</span>
    </footer>
  </section>
</body>
</html>
